services:
  sip-server:
    build: .
    image: intercom-prod-sip-server_main:latest
    network_mode: host
    volumes:
      - ./output-users:/usr/local/freeswitch/conf/directory/autousers/
      - ./volume-configs:/usr/local/freeswitch/conf/callcenter_config/
      - ./log:/usr/local/freeswitch/log
    restart: always
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "2048m"
  
  stun-server:
    image: coturn/coturn:latest
    network_mode: host
    restart: always
    volumes:
      - ./coturn/turnserver.conf:/etc/turnserver.conf:ro
    logging:
      driver: "json-file"
      options:
        max-size: "2048m"

